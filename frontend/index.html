<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskly</title>
  <!-- Apply the saved theme before first paint so dark mode never flashes light -->
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    } catch (e) { /* storage unavailable: stay light */ }
  </script>
  <meta key="title" content="Taskly" property="og:title" />
  <meta content="Make beautiful websites regardless of your design experience." property="og:description" />
  <meta content="Make beautiful websites regardless of your design experience." name="description" />
  <meta key="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    name="viewport" />
  <!-- <link href="/favicon.ico" rel="icon" /> -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
