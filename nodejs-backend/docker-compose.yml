version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: taskly_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: utilization
      MYSQL_USER: taskly
      MYSQL_PASSWORD: taskly_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "taskly", "-ptaskly_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taskly_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskly_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: taskly
      DB_PASSWORD: taskly_pass
      DB_NAME: utilization
      JWT_SECRET: dev_secret_change_in_production_min_32chars!!
      JWT_EXPIRES_IN: 5h
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3030
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src:ro   # hot-reload friendly in dev

volumes:
  mysql_data:
